<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Iframe Viewer</title>
<style>
  body {
    margin: 0;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 8px;
    box-sizing: border-box;
    background-color: #ffffff;
  }

  iframe {
    width: 100%;
    height: 400px;
    border: 2px solid #006db6;
    border-radius: 8px;
  }

  @media (max-width: 600px) {
    iframe {
      height: 300px;
    }
  }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    body {
      background-color: #121212;
    }
    iframe {
      border-color: #80b4d8;
    }
  }
</style>
</head>
<body>
  <iframe src="https://111movies.com/tv/tt2085059/7/4"></iframe>
  <iframe src="https://111movies.com/tv/tt2085059/7/5"></iframe>
  <!-- Add more iframes here -->
</body>
</html>
