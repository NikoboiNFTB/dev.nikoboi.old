<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bingo | Musikcafé After Eight r.f. | Jakobstad</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" sizes="192x192" href="https://static.wixstatic.com/media/d55657_353ea774bef04991b107a9f1080cf9ff%7Emv2.jpg/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/d55657_353ea774bef04991b107a9f1080cf9ff%7Emv2.jpg" type="image/jpeg">
  <link rel="shortcut icon" href="https://static.wixstatic.com/media/d55657_353ea774bef04991b107a9f1080cf9ff%7Emv2.jpg/v1/fill/w_32%2Ch_32%2Clg_1%2Cusm_0.66_1.00_0.01/d55657_353ea774bef04991b107a9f1080cf9ff%7Emv2.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="https://static.wixstatic.com/media/d55657_353ea774bef04991b107a9f1080cf9ff%7Emv2.jpg/v1/fill/w_180%2Ch_180%2Clg_1%2Cusm_0.66_1.00_0.01/d55657_353ea774bef04991b107a9f1080cf9ff%7Emv2.jpg" type="image/jpeg">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="bingo-container">
    <div class="bingo-board">
      <!-- Header -->
      <div class="b-header">B</div>
      <div class="i-header">I</div>
      <div class="n-header">N</div>
      <div class="g-header">G</div>
      <div class="o-header">O</div>

      <!-- Row 1 -->
      <div id="B1"></div>
      <div id="I1"></div>
      <div id="N1"></div>
      <div id="G1"></div>
      <div id="O1"></div>

      <!-- Row 2 -->
      <div id="B2"></div>
      <div id="I2"></div>
      <div id="N2"></div>
      <div id="G2"></div>
      <div id="O2"></div>

      <!-- Row 3 -->
      <div id="B3"></div>
      <div id="I3"></div>
      <div class="free-space marked" id="N3">
        <img src="images/logo.svg" alt="logo" class="logo-img" />
      </div>
      <div id="G3"></div>
      <div id="O3"></div>

      <!-- Row 4 -->
      <div id="B4"></div>
      <div id="I4"></div>
      <div id="N4"></div>
      <div id="G4"></div>
      <div id="O4"></div>

      <!-- Row 5 -->
      <div id="B5"></div>
      <div id="I5"></div>
      <div id="N5"></div>
      <div id="G5"></div>
      <div id="O5"></div>
    </div>

    <!-- Reset Button -->
    <button id="resetBtn"></button>

    <!-- Win Message -->
    <div id="winMessage"></div>
  </div>
</body>
</html>
