        body {

            display: flex;
            justify-content: center;

        }
        .link-div {

            text-align: center;
        }
        .link-box:hover {

            color: #ffffff;
        }
        .image-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 16px;
        }
        img {
            width: 128px;
            height: auto;
            border-radius: 64px;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #e0e0e0;
            }
            a {
                color: #80b4d8;
            }
            a:hover {
                color: #d0e3f3;
            }
            .link-box {
                background-color: #003b5c;
            }
            .link-box:hover {
                background-color: #006db6;
            }
        }

</head>
